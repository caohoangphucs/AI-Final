<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panorama Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1720;
        --panel: rgba(7, 16, 25, 0.84);
        --line: rgba(255, 255, 255, 0.14);
        --text: #eff6ff;
        --muted: #9fb3c8;
        --accent: #7dd3fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(125, 211, 252, 0.15), transparent 32%),
          linear-gradient(180deg, #071019, #0f1720 65%);
      }

      #viewer {
        width: 100vw;
        height: 100vh;
      }

      .panel {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 2;
        width: min(380px, calc(100vw - 32px));
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        backdrop-filter: blur(14px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      p {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.45;
      }

      select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        font: inherit;
      }

      .status {
        margin-top: 10px;
        color: var(--accent);
        font-size: 14px;
      }

      .hint {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .nav-arrow {
        position: fixed;
        z-index: 2;
        width: 52px;
        height: 52px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(7, 16, 25, 0.82);
        color: var(--text);
        font-size: 28px;
        line-height: 1;
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(10px);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.28);
      }

      .nav-arrow:hover {
        border-color: rgba(125, 211, 252, 0.55);
        color: var(--accent);
      }

      .nav-forward {
        left: 50%;
        top: 92px;
        transform: translateX(-50%);
      }

      .nav-backward {
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%) rotate(180deg);
      }

      .nav-left {
        left: 24px;
        top: 50%;
        transform: translateY(-50%) rotate(-90deg);
      }

      .nav-right {
        right: 24px;
        top: 50%;
        transform: translateY(-50%) rotate(90deg);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Panorama 3D Viewer</h1>
      <p>Drag to rotate. Scroll to zoom. Viewer reads cubemap faces built from your downloaded folders.</p>
      <select id="panoramaSelect"></select>
      <div class="status" id="status">Loading panoramas...</div>
      <div class="hint">Source: <code>panorama_build/index.json</code></div>
    </div>
    <button class="nav-arrow nav-forward" id="navForward" title="Move forward">↑</button>
    <button class="nav-arrow nav-backward" id="navBackward" title="Move backward">↑</button>
    <button class="nav-arrow nav-left" id="navLeft" title="Move left">↑</button>
    <button class="nav-arrow nav-right" id="navRight" title="Move right">↑</button>
    <div id="viewer"></div>

    <script type="module">
      import * as THREE from "/node_modules/three/build/three.module.js";

      const viewer = document.getElementById("viewer");
      const panoramaSelect = document.getElementById("panoramaSelect");
      const statusEl = document.getElementById("status");
      const navButtons = {
        forward: document.getElementById("navForward"),
        backward: document.getElementById("navBackward"),
        left: document.getElementById("navLeft"),
        right: document.getElementById("navRight"),
      };

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      viewer.appendChild(renderer.domElement);
      const textureLoader = new THREE.TextureLoader();
      const skyboxGeometry = new THREE.BoxGeometry(1000, 1000, 1000);
      let skyboxMesh = null;

      let lon = 0;
      let lat = 0;
      let isPointerDown = false;
      let pointerDownX = 0;
      let pointerDownY = 0;
      let pointerDownLon = 0;
      let pointerDownLat = 0;
      let panoramas = [];
      let panoramaIndexByName = new Map();
      let currentPanorama = null;

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function updateNavigation() {
        if (!currentPanorama || !currentPanorama.neighbors) {
          Object.values(navButtons).forEach((button) => {
            button.style.display = "none";
            button.onclick = null;
          });
          return;
        }

        for (const [direction, button] of Object.entries(navButtons)) {
          const neighbor = currentPanorama.neighbors[direction];
          if (!neighbor) {
            button.style.display = "none";
            button.onclick = null;
            continue;
          }

          button.style.display = "flex";
          button.onclick = async () => {
            const nextIndex = panoramaIndexByName.get(neighbor.panorama);
            if (typeof nextIndex !== "number") {
              return;
            }

            panoramaSelect.value = String(nextIndex);
            await showPanorama(panoramas[nextIndex]);
          };
        }
      }

      function faceUrls(panorama) {
        return {
          r: `/panorama_build/${panorama.faces.r}`,
          l: `/panorama_build/${panorama.faces.l}`,
          u: `/panorama_build/${panorama.faces.u}`,
          d: `/panorama_build/${panorama.faces.d}`,
          f: `/panorama_build/${panorama.faces.f}`,
          b: `/panorama_build/${panorama.faces.b}`,
        };
      }

      async function getIndex() {
        const response = await fetch("/panorama_build/index.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("No build found. Run npm run build:panoramas first.");
        }

        return response.json();
      }

      function loadPanorama(panorama) {
        const urls = faceUrls(panorama);
        const loadTexture = (url) =>
          new Promise((resolve, reject) => {
            textureLoader.load(
              url,
              (texture) => {
                texture.colorSpace = THREE.SRGBColorSpace;
                resolve(texture);
              },
              undefined,
              reject
            );
          });

        return Promise.all([
          loadTexture(urls.r),
          loadTexture(urls.l),
          loadTexture(urls.u),
          loadTexture(urls.d),
          loadTexture(urls.f),
          loadTexture(urls.b),
        ])
          .then((textures) => {
            if (skyboxMesh) {
              scene.remove(skyboxMesh);
              skyboxMesh.material.forEach((material) => material.dispose());
            }

            const materials = textures.map(
              (texture) =>
                new THREE.MeshBasicMaterial({
                  map: texture,
                  side: THREE.BackSide,
                })
            );

            skyboxMesh = new THREE.Mesh(skyboxGeometry, materials);
            scene.add(skyboxMesh);
            currentPanorama = panorama;
            updateNavigation();
            setStatus(`Viewing ${panorama.name}`);
          })
          .catch(() => {
            setStatus(`Failed to load ${panorama.name}`);
            throw new Error(`Failed to load textures for ${panorama.name}`);
          });
      }

      async function showPanorama(panorama) {
        await loadPanorama(panorama);
      }

      function animate() {
        requestAnimationFrame(animate);

        lat = Math.max(-85, Math.min(85, lat));
        const phi = THREE.MathUtils.degToRad(90 - lat);
        const theta = THREE.MathUtils.degToRad(lon);
        const target = new THREE.Vector3(
          500 * Math.sin(phi) * Math.cos(theta),
          500 * Math.cos(phi),
          500 * Math.sin(phi) * Math.sin(theta)
        );

        camera.lookAt(target);
        renderer.render(scene, camera);
      }

      function attachEvents() {
        renderer.domElement.addEventListener("pointerdown", (event) => {
          isPointerDown = true;
          pointerDownX = event.clientX;
          pointerDownY = event.clientY;
          pointerDownLon = lon;
          pointerDownLat = lat;
        });

        window.addEventListener("pointermove", (event) => {
          if (!isPointerDown) return;
          lon = (pointerDownX - event.clientX) * 0.12 + pointerDownLon;
          lat = (event.clientY - pointerDownY) * 0.12 + pointerDownLat;
        });

        window.addEventListener("pointerup", () => {
          isPointerDown = false;
        });

        window.addEventListener("wheel", (event) => {
          camera.fov = THREE.MathUtils.clamp(camera.fov + event.deltaY * 0.03, 35, 100);
          camera.updateProjectionMatrix();
        });

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      async function init() {
        try {
          const index = await getIndex();
          panoramas = index.panoramas || [];
          panoramaIndexByName = new Map(panoramas.map((panorama, index) => [panorama.name, index]));

          if (panoramas.length === 0) {
            setStatus("No panoramas available.");
            return;
          }

          panoramaSelect.innerHTML = "";
          panoramas.forEach((panorama, index) => {
            const option = document.createElement("option");
            option.value = String(index);
            option.textContent = `${index + 1}. ${panorama.name}`;
            panoramaSelect.appendChild(option);
          });

          panoramaSelect.addEventListener("change", async () => {
            const selected = panoramas[Number.parseInt(panoramaSelect.value, 10)];
            await showPanorama(selected);
          });

          attachEvents();
          await showPanorama(panoramas[0]);
          animate();
        } catch (error) {
          setStatus(error.message);
          console.error(error);
        }
      }

      init();
    </script>
  </body>
</html>
